<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Preview</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Poppins:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', -apple-system, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 32px; }
  a { text-decoration: none; }
  section { padding: 96px 0; }
  h1, h2, h3 { line-height: 1.15; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 16px 32px; border-radius: 100px;
    font-weight: 700; font-size: 14.5px; cursor: pointer; border: none; transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
  .fade-up { animation: fadeUp .8s ease both; }
  .fade-up.d1 { animation-delay: .1s; } .fade-up.d2 { animation-delay: .22s; } .fade-up.d3 { animation-delay: .34s; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .icon-svg { width: 22px; height: 22px; }
  @media (max-width: 900px) {
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr; gap: 32px; }
    section { padding: 56px 0; }
    .wrap { padding: 0 22px; }
  }
  #app { display: none; }
  #fallback { max-width: 480px; margin: 100px auto; text-align: center; padding: 0 24px; font-family: sans-serif; color: #666; }
  .placeholder-note { font-size: 11px; opacity: .65; font-style: italic; }
</style>
</head>
<body>

<div id="fallback">
  <h2 style="margin-bottom:12px;">Preview link looks incomplete</h2>
  <p>This link is missing its business data. Ask whoever sent it to regenerate the preview link.</p>
</div>

<div id="app"></div>

<script>
function decodePayload() {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('d');
  if (!raw) return null;
  try { return JSON.parse(decodeURIComponent(atob(raw))); } catch (e) { return null; }
}

// ── Category → theme mapping ──────────────────────────────────────────
const THEME_MAP = {
  real_estate: 'real_estate',
  salons: 'beauty', spas: 'beauty', clothing_boutiques: 'beauty', boutiques: 'beauty', jewellers: 'beauty',
  dentists: 'health', clinics: 'health', daycare: 'health',
  interior_designers: 'design', architects: 'design', furniture_stores: 'design',
  gyms: 'fitness',
  cafes: 'cafe', restaurants: 'cafe', bakeries: 'cafe',
};
function getThemeKey(category) { return THEME_MAP[category] || 'general'; }

// ── Small reusable line-art icon set (no emoji — keeps things premium) ──
const ICON_PATHS = [
  '<circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2 2 5-5" stroke-linecap="round" stroke-linejoin="round"/>', // check-circle
  '<path d="M12 3l2.6 5.9L21 9.6l-4.5 4.2L17.6 21 12 17.6 6.4 21l1.1-7.2L3 9.6l6.4-.7L12 3z" stroke-linejoin="round"/>', // star
  '<path d="M12 3l7 3v5c0 5-3.2 8.4-7 10-3.8-1.6-7-5-7-10V6l7-3z" stroke-linejoin="round"/>', // shield
  '<path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" stroke-linejoin="round"/>', // bolt
  '<path d="M12 20s-7-4.4-7-10a4.5 4.5 0 0 1 7-3.7A4.5 4.5 0 0 1 19 10c0 5.6-7 10-7 10z" stroke-linejoin="round"/>', // heart
  '<rect x="5" y="5" width="14" height="14" rx="3" transform="rotate(45 12 12)"/>', // diamond
];
function icon(i, color, size) {
  return `<svg class="icon-svg" style="width:${size||22}px;height:${size||22}px;" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.6">${ICON_PATHS[i % ICON_PATHS.length]}</svg>`;
}

function starRow(rating) {
  const full = Math.round(rating);
  return '★'.repeat(full) + '☆'.repeat(5 - full);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function render(payload) {
  const name = payload.n || 'Your Business';
  const categoryKey = payload.c || 'other';
  const categoryLabel = payload.cl || 'Business';
  const city = payload.ci || '';
  const area = payload.ar || '';
  const phone = (payload.p || '').replace(/[^0-9]/g, '');
  const rating = payload.r;
  const ratingCount = payload.rc;

  const themeKey = getThemeKey(categoryKey);
  const t = THEMES[themeKey];
  const services = typeof t.services === 'function' ? t.services(categoryLabel) : t.services;
  const eyebrowText = typeof t.eyebrow === 'function' ? t.eyebrow(categoryLabel) : t.eyebrow;
  const waLink = phone ? `https://wa.me/${phone}` : null;
  const telLink = phone ? `tel:${phone}` : null;
  const heroTextColor = t.isDarkTheme ? t.ink : '#fff';
  const bodyBg = t.isDarkTheme ? t.dark : t.paper;
  const bodyInk = t.isDarkTheme ? t.ink : t.ink;

  document.title = name;
  document.body.style.background = bodyBg;
  document.body.style.color = bodyInk;

  const navBg = t.isDarkTheme ? t.dark : t.paper;
  const cardBg = t.card;

  const trustHTML = t.trustBullets.map((b, i) => `
    <div style="display:flex;align-items:center;gap:8px;">
      ${icon(i, t.accent, 17)}
      <span style="font-size:12.5px;color:${t.isDarkTheme ? '#c7ceca' : t.ink + 'bb'};">${esc(b)}</span>
    </div>`).join('');

  const statsHTML = t.stats.map((s, i) => `
    <div style="text-align:center;">
      <div style="font-family:${t.headFont};font-size:26px;font-weight:${t.weight};color:${t.accent};margin-bottom:4px;">${esc(s[0])}</div>
      <div style="font-size:12px;color:${t.isDarkTheme ? '#9aa39c' : t.ink + '99'};">${esc(s[1])}</div>
    </div>`).join('');

  const servicesHTML = services.map((s, i) => `
    <div style="background:${cardBg};border:1px solid ${t.line};border-radius:16px;padding:28px 24px;">
      <div style="width:44px;height:44px;border-radius:12px;background:${t.accentSoft};display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
        ${icon(i, t.accent, 20)}
      </div>
      <p style="font-weight:700;font-size:15.5px;margin-bottom:6px;">${esc(s.t)}</p>
      <p style="font-size:13px;color:${t.isDarkTheme ? '#a6ada6' : t.ink + '99'};line-height:1.55;">${esc(s.d)}</p>
    </div>`).join('');

  const checklistHTML = t.aboutChecklist.map((c, i) => `
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;">
      ${icon(0, t.accent, 18)}
      <span style="font-size:13.5px;">${esc(c)}</span>
    </div>`).join('');

  const pricingHTML = t.pricing.map(p => `
    <div style="background:${cardBg};border:${p.popular ? `1.5px solid ${t.accent}` : `1px solid ${t.line}`};border-radius:16px;padding:30px 26px;position:relative;">
      ${p.popular ? `<div style="position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:${t.accent};color:${t.accentInk};font-size:10px;font-weight:800;padding:4px 12px;border-radius:20px;letter-spacing:.05em;">MOST POPULAR</div>` : ''}
      <p style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:${t.isDarkTheme ? '#9aa39c' : t.ink + '99'};margin-bottom:10px;">${esc(p.tier)}</p>
      <p style="font-family:${t.headFont};font-size:28px;font-weight:${t.weight};margin-bottom:4px;">${esc(p.price)}<span style="font-size:13px;font-weight:400;opacity:.7;"> ${esc(p.unit)}</span></p>
      <div style="height:1px;background:${t.line};margin:16px 0;"></div>
      ${p.items.map(it => `<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:13px;">${icon(0, t.accent, 15)}<span>${esc(it)}</span></div>`).join('')}
      <p class="placeholder-note" style="margin-top:12px;color:${t.isDarkTheme ? '#8f978f' : t.ink + '88'};">Sample pricing — customize to match your real rates</p>
    </div>`).join('');

  const app = document.getElementById('app');
  app.style.display = 'block';
  document.getElementById('fallback').style.display = 'none';

  app.innerHTML = `
    <nav style="position:sticky;top:0;background:${navBg}ee;backdrop-filter:blur(10px);border-bottom:1px solid ${t.line};z-index:10;">
      <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;height:80px;">
        <span style="font-family:${t.headFont};font-weight:${t.weight};font-size:19px;">${esc(name)}</span>
        ${telLink ? `<a href="${telLink}" class="btn" style="background:${t.accent};color:${t.accentInk};">Call Now</a>` : ''}
      </div>
    </nav>

    <div style="background:${t.isDarkTheme ? `linear-gradient(155deg, ${t.dark}, ${t.darkAlt})` : `linear-gradient(155deg, ${t.dark}, ${t.darkAlt})`};color:#fff;position:relative;overflow:hidden;">
      <div class="wrap grid-2" style="padding:88px 32px 96px;">
        <div>
          <p class="eyebrow fade-up" style="color:${t.accent};margin-bottom:20px;">${esc(eyebrowText)}</p>
