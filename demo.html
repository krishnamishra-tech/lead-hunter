<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Preview</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="shared-demo-templates.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', -apple-system, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: inherit; }
  h1, h2, h3 { line-height: 1.15; }
  .rise { opacity: 0; transform: translateY(14px); animation: rise .8s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .r1 { animation-delay: .05s; } .r2 { animation-delay: .14s; } .r3 { animation-delay: .23s; } .r4 { animation-delay: .32s; }
  @media (prefers-reduced-motion: reduce) { .rise { opacity: 1; transform: none; animation: none; } }
  #app { display: none; }
  #fallback { max-width: 480px; margin: 100px auto; text-align: center; padding: 0 24px; font-family: sans-serif; color: #666; }
</style>
</head>
<body>

<div id="fallback">
  <h2 style="margin-bottom:12px;">Preview link looks incomplete</h2>
  <p>This link is missing its business data. Ask whoever sent it to regenerate the preview link.</p>
</div>

<div id="app"></div>

<script>
function decodePayload() {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('d');
  if (!raw) return null;
  try {
    return JSON.parse(decodeURIComponent(atob(raw)));
  } catch (e) {
    return null;
  }
}

function render(payload) {
  const d = {
    name: payload.n || 'Your Business',
    categoryKey: payload.c || 'other',
    categoryLabel: payload.cl || 'Business',
    city: payload.ci || '',
    area: payload.ar || '',
    phone: (payload.p || '').replace(/[^0-9]/g, ''),
    rating: payload.r || null,
    ratingCount: payload.rc || null,
  };
  const family = getFamily(d.categoryKey);
  const app = document.getElementById('app');
  app.style.display = 'block';
  document.getElementById('fallback').style.display = 'none';
  app.innerHTML = RENDERERS[family](d);
}

const payload = decodePayload();
if (payload) render(payload);
</script>
</body>
</html>
